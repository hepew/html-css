<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        .num{
            text-align: right;
        }
table{
   border-collapse: collapse;
    width: 400px;
}
thead, tfoot{
    background-color: gray;
    color: white;
}
td, th{
    
     border: 1px solid black;
}
    </style>
    <title>Tabela grande</title>
</head>
<body>
<h1>Tabela grande</h1>
    <table>
        <thead>
           <th>Estado</th>
           <th>População</th>
        </thead>
        <tbody>
            <tr>
                <td>São paulo</td>
                <td class="num">46 081 801</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="num">21 393 441</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="num">17 223 547</td>
            </tr>
            <td>Bahia</td>
            <td class="num">14 141 626</td>
        </tbody>
        <tfoot>
            <th>Total de Habitantes</th>
            <td class="num"><strong>98.840.415</strong></td>
        </tfoot>
    </table>
</body>
</html>
