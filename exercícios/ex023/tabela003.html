<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        
        table{
            border-collapse: collapse;
            text-align: center;
            width: 400px;
        }
        td{
            border: 1px solid black;
            padding: 10px;
        
        }
    </style>
    <title>Mesclagem de células</title>
</head>
<body>
    <table>
        <tr>
            <td rowspan="3">A</td>
            <td colspan="2">B</td>
           
        </tr>
        <tr>
            
            <td>E</td>
            <td>F</td>
        </tr>
        <tr>
            
            <td colspan="2">H</td>
            
        </tr>
        <tr>
            <td colspan="3">G</td>
        
        </tr>
        <tr>
            <td rowspan="3">J</td>
            
            <td colspan="2">L</td>
        </tr>
        <tr>
            <td>B</td>
            <td>C</td>
            
           
        </tr>
        <tr>
          
            <td>F</td>
            <td>G</td>
        </tr>
    </table>
</body>
</html>
