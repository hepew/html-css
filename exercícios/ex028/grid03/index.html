<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        div.container{
            display: grid;
            border: 3px solid blue;
            
            grid-template-rows: repeat(3, 80px);
            grid-template-columns:100px 30% repeat(2, 1fr);

            grid-auto-flow: row; /*Por padrão é o row A B C
                                                      D E F
                                                      G H I 
                                                       J
                                                      
                                                 
            com o colum ele
            deixa os items de ima para baixo A D G J
                                             B E H
                                             C F I
                                                    */
            grid-auto-rows: 80px;
 /*Ele adiciona uma linha abaixo sempre que for implícito um item (sucessivamente tem o columns também)*/
            grid-auto-columns: 120px;

            place-items: normal normal;
            place-content: normal normal; 
             
            gap: 10px;
        }

        div.item{
            border: 3px solid rgb(255, 0, 0);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>

    </div>
</body>
</html>
