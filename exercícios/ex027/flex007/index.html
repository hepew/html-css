<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        .pai{
            display: flex;
            background-color: aqua;
            flex-flow: row wrap;
        }
        .filho{
            padding: 20px;
            background-color: #88ff00;
            border: 1px solid black;
            text-align: center;
        }

        #i1{
            order: -1;
        }

        #i2{
            order: -2;
        }

        #i3{
            order: 4;
        }

        #i4{
            order: 0;
        }

        #i5{
            order: -1;
        }
    </style>
</head>
<body>
    <div class="pai">
        <div class="filho" id="i1">A</div>
        <div class="filho" id="i2">B</div>
        <div class="filho" id="i3">C</div>
        <div class="filho" id="i4">D</div>
        <div class="filho" id="i5">E</div>
    </div>
</body>
</html>
