<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        .pai{
            align-items: flex-start;
            height: 400px;
            display: flex;
            background-color: aqua;
            flex-flow: row wrap;
        }
        .filho{
            padding: 20px;
            background-color: #88ff00;
            border: 1px solid black;
            text-align: center;
        }

        #i1{
            align-self: flex-end;
        }

        #i2{
            align-self: center;
        }

        #i3{
            align-self: center;
        }

        #i4{
            align-self: center;
        }

        #i5{
            align-self: stretch;
        }

        #i6{
            align-self: stretch;
        }

        #i7{
            align-self: center;

        }

        #i8{
            align-self: flex-end;

        }

        #i9{
          align-self: flex-end;
        }

        #i10{
           align-self: center;
        }

        #i11{
         align-self: flex-start;
        }

        #i12{
            align-self: stretch;
        }

        #i13{
            align-self: flex-end;
        }

        #i14{
            align-self: center;
        }

        #i15{
            align-self: stretch;
        }
         #i16{
            align-self: flex-end;
        }
    </style>
</head>
<body>
    <div class="pai">
        <div class="filho" id="i1">A</div>
        <div class="filho" id="i2">B</div>
        <div class="filho" id="i3">C</div>
        <div class="filho" id="i4">D</div>
        <div class="filho" id="i5">E</div>
        <div class="filho" id="i6">F</div>
        <div class="filho" id="i7">G</div>
        <div class="filho" id="i8">H</div>
        <div class="filho" id="i9">I</div>
        <div class="filho" id="i10">J</div>
        <div class="filho" id="i11">K</div>
        <div class="filho" id="i12">L</div>
        <div class="filho" id="i13">M</div>
        <div class="filho" id="i14">N</div>
        <div class="filho" id="i15">O</div>
        <div class="filho" id="i16">P</div>
        
    </div>
</body>
</html>
