<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        .pai{
            display: flex;
            background-color: aqua;
            flex-flow: row nowrap;
        }
        .filho{
            flex-basis: 200px;
            background-color: #ccc;
            border: 1px solid black;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="pai">
        <div class="filho">AAAAAAAAAAAAAAA</div>
        <div class="filho">B</div>
        <div class="filho">CCCCCCCCCCCCCCCCCCCC</div>
        <div class="filho">D</div>
        <div class="filho">TEXTO GRANDEEEEE</div>
    </div>
</body>
</html>
